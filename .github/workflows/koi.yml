
name: GitHub Profile Koi

on:
  schedule:
    - cron: "0 * * * *"   # Runs every hour

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate GitHub Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: AnshRaj112
          body: white
          output-dir: koi

      - name: Commit Koi GIF
        shell: bash
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "Koi unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --quiet -m "Update GitHub Koi"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
